name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Swift 6.3 Xcode
        run: |
          set -euo pipefail
          LATEST_XCODE="$(
            while IFS= read -r candidate; do
              if DEVELOPER_DIR="$candidate/Contents/Developer" xcrun swift --version 2>&1 | grep -qE "Swift version 6\\.3"; then
                echo "$candidate"
                break
              fi
            done < <(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' -print | sort -Vr)
          )"
          if [[ -z "$LATEST_XCODE" ]]; then
            echo "No installed Xcode provides Swift 6.3" >&2
            exit 1
          fi
          DEVELOPER_DIR="$LATEST_XCODE/Contents/Developer"
          echo "Using DEVELOPER_DIR=$DEVELOPER_DIR"
          sudo xcode-select -s "$DEVELOPER_DIR"
      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Assert Swift 6.3
        run: xcrun swift --version 2>&1 | grep -E "Swift version 6\\.3"
      - name: Install linters
        run: brew install swiftlint swiftformat
      - name: SwiftFormat
        run: swiftformat Sources Tests Examples --lint
      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml
      - name: Swift test + coverage
        run: swift test --enable-code-coverage -Xswiftc -warnings-as-errors
      - name: Assert 70% coverage
        run: ./scripts/check-coverage.sh 70
      - name: Swift build example
        run: (cd Examples/ElevenLabsKitExample && swift build -Xswiftc -warnings-as-errors)
      - name: Swift build CLI example
        run: (cd Examples/ElevenLabsKitCLI && swift build -Xswiftc -warnings-as-errors)
